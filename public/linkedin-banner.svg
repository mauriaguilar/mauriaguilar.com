<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Gradiente de fondo: azul marino profundo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1425"/>
      <stop offset="100%" stop-color="#111d35"/>
    </linearGradient>

    <!-- Glow para nodos principales -->
    <radialGradient id="nodeGlow">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow cálido (acento) -->
    <radialGradient id="warmGlow">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow ambiental derecha -->
    <radialGradient id="ambientRight" cx="85%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow ambiental sutil centro -->
    <radialGradient id="ambientCenter" cx="55%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#162544" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtro de brillo suave -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== FONDO ==================== -->
  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#ambientRight)"/>
  <rect width="1584" height="396" fill="url(#ambientCenter)"/>

  <!-- Textura de grilla sutil (solo zona derecha) -->
  <g opacity="0.03" stroke="#60a5fa" stroke-width="0.5">
    <line x1="600" y1="0" x2="600" y2="396"/>
    <line x1="700" y1="0" x2="700" y2="396"/>
    <line x1="800" y1="0" x2="800" y2="396"/>
    <line x1="900" y1="0" x2="900" y2="396"/>
    <line x1="1000" y1="0" x2="1000" y2="396"/>
    <line x1="1100" y1="0" x2="1100" y2="396"/>
    <line x1="1200" y1="0" x2="1200" y2="396"/>
    <line x1="1300" y1="0" x2="1300" y2="396"/>
    <line x1="1400" y1="0" x2="1400" y2="396"/>
    <line x1="1500" y1="0" x2="1500" y2="396"/>
    <line x1="500" y1="50" x2="1584" y2="50"/>
    <line x1="500" y1="150" x2="1584" y2="150"/>
    <line x1="500" y1="250" x2="1584" y2="250"/>
    <line x1="500" y1="350" x2="1584" y2="350"/>
  </g>

  <!-- ==================== CONEXIONES (líneas entre nodos) ==================== -->
  <!-- Capa 1: Líneas tenues de fondo — red extendida -->
  <g stroke="#60a5fa" stroke-width="0.5" opacity="0.08">
    <line x1="350" y1="80" x2="580" y2="140"/>
    <line x1="580" y1="140" x2="750" y2="60"/>
    <line x1="750" y1="60" x2="950" y2="120"/>
    <line x1="950" y1="120" x2="1150" y2="50"/>
    <line x1="1150" y1="50" x2="1380" y2="100"/>
    <line x1="1380" y1="100" x2="1520" y2="180"/>
    <line x1="400" y1="200" x2="650" y2="250"/>
    <line x1="650" y1="250" x2="850" y2="200"/>
    <line x1="850" y1="200" x2="1050" y2="280"/>
    <line x1="1050" y1="280" x2="1300" y2="220"/>
    <line x1="1300" y1="220" x2="1500" y2="300"/>
    <line x1="500" y1="330" x2="700" y2="350"/>
    <line x1="700" y1="350" x2="950" y2="310"/>
    <line x1="950" y1="310" x2="1200" y2="360"/>
    <line x1="1200" y1="360" x2="1450" y2="330"/>
  </g>

  <!-- Capa 2: Líneas de conexión principales (más visibles, zona derecha) -->
  <g stroke="#60a5fa" stroke-width="0.8" opacity="0.2" filter="url(#softGlow)">
    <!-- Cluster superior derecho -->
    <line x1="880" y1="85" x2="1050" y2="55"/>
    <line x1="1050" y1="55" x2="1220" y2="90"/>
    <line x1="1220" y1="90" x2="1380" y2="45"/>
    <line x1="1380" y1="45" x2="1500" y2="110"/>
    <line x1="1050" y1="55" x2="1100" y2="160"/>
    <line x1="1220" y1="90" x2="1280" y2="180"/>
    <line x1="1380" y1="45" x2="1420" y2="155"/>

    <!-- Cluster central-derecho -->
    <line x1="780" y1="180" x2="960" y2="150"/>
    <line x1="960" y1="150" x2="1100" y2="160"/>
    <line x1="1100" y1="160" x2="1280" y2="180"/>
    <line x1="1280" y1="180" x2="1420" y2="155"/>
    <line x1="1420" y1="155" x2="1530" y2="200"/>
    <line x1="960" y1="150" x2="1020" y2="250"/>
    <line x1="1280" y1="180" x2="1330" y2="270"/>

    <!-- Cluster inferior derecho -->
    <line x1="850" y1="280" x2="1020" y2="250"/>
    <line x1="1020" y1="250" x2="1180" y2="290"/>
    <line x1="1180" y1="290" x2="1330" y2="270"/>
    <line x1="1330" y1="270" x2="1480" y2="310"/>
    <line x1="1180" y1="290" x2="1220" y2="360"/>
    <line x1="1330" y1="270" x2="1400" y2="350"/>
  </g>

  <!-- Capa 3: Líneas más brillantes — rutas principales -->
  <g stroke="#93c5fd" stroke-width="1" opacity="0.35" filter="url(#softGlow)">
    <!-- Ruta principal diagonal: centro-izq → derecha-arriba -->
    <line x1="520" y1="220" x2="780" y2="180"/>
    <line x1="780" y1="180" x2="1050" y2="55"/>
    <line x1="1050" y1="55" x2="1380" y2="45"/>
    <line x1="1380" y1="45" x2="1530" y2="100"/>

    <!-- Ruta secundaria: centro → derecha-abajo -->
    <line x1="630" y1="280" x2="850" y2="280"/>
    <line x1="850" y1="280" x2="1100" y2="160"/>
    <line x1="1100" y1="160" x2="1330" y2="270"/>
    <line x1="1330" y1="270" x2="1500" y2="240"/>
  </g>

  <!-- Capa 4: Líneas de alta energía (acento cálido) — pocas, estratégicas -->
  <g stroke="#f59e0b" stroke-width="0.8" opacity="0.25" filter="url(#softGlow)">
    <line x1="1050" y1="55" x2="1220" y2="90"/>
    <line x1="1220" y1="90" x2="1280" y2="180"/>
    <line x1="1280" y1="180" x2="1330" y2="270"/>
  </g>

  <!-- ==================== NODOS ==================== -->

  <!-- Halos de glow detrás de nodos principales -->
  <circle cx="1050" cy="55" r="25" fill="url(#nodeGlow)" opacity="0.5"/>
  <circle cx="1280" cy="180" r="20" fill="url(#nodeGlow)" opacity="0.4"/>
  <circle cx="1380" cy="45" r="18" fill="url(#nodeGlow)" opacity="0.35"/>
  <circle cx="1220" cy="90" r="15" fill="url(#warmGlow)" opacity="0.5"/>

  <!-- Nodos pequeños tenues (zona izquierda — pocos, dispersos) -->
  <g fill="#60a5fa" opacity="0.15">
    <circle cx="350" cy="80" r="1.5"/>
    <circle cx="400" cy="200" r="1.5"/>
    <circle cx="300" cy="320" r="1"/>
    <circle cx="200" cy="150" r="1"/>
    <circle cx="150" cy="280" r="1"/>
  </g>

  <!-- Nodos medianos (zona de transición) -->
  <g fill="#60a5fa" opacity="0.3">
    <circle cx="520" cy="220" r="2"/>
    <circle cx="580" cy="140" r="2"/>
    <circle cx="630" cy="280" r="2"/>
    <circle cx="500" cy="330" r="1.5"/>
    <circle cx="700" cy="350" r="1.5"/>
    <circle cx="750" cy="60" r="2"/>
  </g>

  <!-- Nodos visibles (zona central-derecha) -->
  <g filter="url(#softGlow)">
    <circle cx="780" cy="180" r="3" fill="#93c5fd" opacity="0.6"/>
    <circle cx="850" cy="280" r="2.5" fill="#93c5fd" opacity="0.5"/>
    <circle cx="880" cy="85" r="2.5" fill="#93c5fd" opacity="0.5"/>
    <circle cx="950" cy="120" r="2" fill="#60a5fa" opacity="0.4"/>
    <circle cx="950" cy="310" r="2" fill="#60a5fa" opacity="0.4"/>
    <circle cx="960" cy="150" r="3" fill="#93c5fd" opacity="0.6"/>
    <circle cx="1020" cy="250" r="3" fill="#93c5fd" opacity="0.6"/>
  </g>

  <!-- Nodos principales brillantes (zona derecha — peso visual máximo) -->
  <g filter="url(#strongGlow)">
    <!-- Nodo hub principal -->
    <circle cx="1050" cy="55" r="4.5" fill="#bfdbfe" opacity="0.9"/>
    <circle cx="1050" cy="55" r="2.5" fill="#ffffff" opacity="0.8"/>

    <!-- Nodo acento cálido -->
    <circle cx="1220" cy="90" r="3.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="1220" cy="90" r="2" fill="#fef3c7" opacity="0.7"/>

    <!-- Nodos secundarios brillantes -->
    <circle cx="1100" cy="160" r="3.5" fill="#93c5fd" opacity="0.8"/>
    <circle cx="1280" cy="180" r="4" fill="#bfdbfe" opacity="0.85"/>
    <circle cx="1280" cy="180" r="2" fill="#ffffff" opacity="0.7"/>

    <circle cx="1330" cy="270" r="3.5" fill="#93c5fd" opacity="0.75"/>
    <circle cx="1380" cy="45" r="3.5" fill="#bfdbfe" opacity="0.8"/>
    <circle cx="1420" cy="155" r="3" fill="#93c5fd" opacity="0.7"/>
    <circle cx="1480" cy="310" r="2.5" fill="#60a5fa" opacity="0.6"/>
    <circle cx="1500" cy="110" r="2.5" fill="#93c5fd" opacity="0.65"/>
    <circle cx="1500" cy="240" r="2.5" fill="#60a5fa" opacity="0.5"/>
    <circle cx="1530" cy="200" r="3" fill="#93c5fd" opacity="0.7"/>

    <!-- Nodo acento cálido secundario -->
    <circle cx="1180" cy="290" r="3" fill="#fbbf24" opacity="0.6"/>
    <circle cx="1180" cy="290" r="1.5" fill="#fef3c7" opacity="0.5"/>
  </g>

  <!-- Nodos de borde derecho (fade out) -->
  <g fill="#60a5fa" opacity="0.25">
    <circle cx="1540" cy="50" r="1.5"/>
    <circle cx="1560" cy="150" r="1.5"/>
    <circle cx="1550" cy="350" r="1.5"/>
    <circle cx="1450" cy="330" r="2"/>
    <circle cx="1400" cy="350" r="1.5"/>
    <circle cx="1220" cy="360" r="1.5"/>
  </g>

  <!-- ==================== PARTÍCULAS DECORATIVAS ==================== -->
  <!-- Puntos diminutos (polvo estelar) — más densos a la derecha -->
  <g fill="#60a5fa" opacity="0.1">
    <circle cx="420" cy="120" r="0.8"/>
    <circle cx="480" cy="170" r="0.6"/>
    <circle cx="550" cy="90" r="0.7"/>
    <circle cx="610" cy="310" r="0.8"/>
    <circle cx="670" cy="180" r="0.6"/>
    <circle cx="720" cy="250" r="0.7"/>
  </g>
  <g fill="#60a5fa" opacity="0.15">
    <circle cx="810" cy="130" r="0.8"/>
    <circle cx="870" cy="200" r="0.7"/>
    <circle cx="910" cy="350" r="0.8"/>
    <circle cx="990" cy="200" r="0.7"/>
    <circle cx="1010" cy="340" r="0.8"/>
    <circle cx="1060" cy="130" r="0.7"/>
    <circle cx="1120" cy="230" r="0.8"/>
    <circle cx="1160" cy="130" r="0.7"/>
    <circle cx="1250" cy="140" r="0.8"/>
    <circle cx="1300" cy="320" r="0.7"/>
    <circle cx="1350" cy="120" r="0.8"/>
    <circle cx="1440" cy="250" r="0.7"/>
    <circle cx="1470" cy="80" r="0.8"/>
    <circle cx="1510" cy="280" r="0.7"/>
  </g>

  <!-- Partículas blancas sutiles -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="1090" cy="100" r="0.5"/>
    <circle cx="1200" cy="200" r="0.5"/>
    <circle cx="1350" cy="180" r="0.5"/>
    <circle cx="1450" cy="140" r="0.5"/>
    <circle cx="1500" cy="160" r="0.5"/>
  </g>
</svg>
